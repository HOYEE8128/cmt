<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>소통</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<meta name="theme-color" content="#f5f6f8">
<style>
  body { margin: 0; font-family: -apple-system, 'Malgun Gothic', sans-serif; background: #f5f6f8;
         color: #1c1c1e; padding: 32px 20px; line-height: 1.7; }
  button { font-size: 17px; font-weight: 600; padding: 14px 22px; border-radius: 10px; border: 0;
           background: #03c75a; color: #fff; width: 100%; margin-top: 12px; }
  #out { margin-top: 20px; padding: 14px 16px; background: #fff; border-radius: 10px;
         border: 1px solid #e5e7eb; font-size: 15px; white-space: pre-wrap; min-height: 60px; }
</style>
</head>
<body>
<!-- 2026-09-15. 연결 시험 페이지. 공인 사이트(github.io)에서 테일넷 PC(100.x)로 요청이 가는지,
     크롬이 로컬 네트워크 권한을 묻는지 폰에서 확인하려고 잠깐 둔다. 확인이 끝나면 실제 댓글 화면으로 바꾼다. -->
<h2 style="margin:0 0 8px">PC 연결 시험</h2>
<div>앱 모드: <b id="mode"></b></div>
<button id="t">PC에 연결해 보기</button>
<div id="out">아직 안 눌렀습니다.</div>
<script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
  var app = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  document.getElementById('mode').textContent = app ? '예 (홈 화면 앱)' : '아니오 (크롬 탭)';
  var out = document.getElementById('out');
  function line(s) { out.textContent += '\n' + s; }

  document.getElementById('t').onclick = async function () {
    out.textContent = '시험 시작 ' + new Date().toLocaleTimeString();
    try {
      if (navigator.permissions) {
        var p = await navigator.permissions.query({ name: 'local-network-access' });
        line('권한 상태(시작 전): ' + p.state);
      }
    } catch (e) { line('권한 상태 조회 불가: ' + e.message); }
    var t0 = Date.now();
    try {
      await fetch('https://hoyee.tail799edd.ts.net/api/me?t=' + t0, { mode: 'no-cors', cache: 'no-store' });
      line('결과: 연결됨 (' + (Date.now() - t0) + 'ms)');
    } catch (e) {
      line('결과: 막힘 — ' + e.message + ' (' + (Date.now() - t0) + 'ms)');
    }
    try {
      if (navigator.permissions) {
        var p2 = await navigator.permissions.query({ name: 'local-network-access' });
        line('권한 상태(끝난 뒤): ' + p2.state);
      }
    } catch (e) {}
  };
</script>
</body>
</html>
